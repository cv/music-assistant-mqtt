name: release

on:
  push:
    tags:
      - "v*"

# The image (Dockerfile) for linux/amd64 and linux/arm64, as ghcr.io/<owner>/music-assistant-mqtt
# :<version> and :<major>.<minor>. The laws must check and the tag must be mam.bend's version().
# The build stage runs on the runner and cross-compiles (zig), so no emulation is needed.
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Version
        run: |
          v=$(grep -A1 '^def version()' mam.bend | tail -1 | tr -d ' "')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, mam.bend says $v" >&2; exit 1; }

      - name: Bend
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install bend
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Laws
        run: |
          bend PROOF.bend | tee proof.txt
          grep -q "ALL PROOFS CHECK" proof.txt

      - name: C
        run: mkdir -p out && bend mam.bend -o out/mam.c

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
